name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout is a first-party action; pinned to the v4 major tag.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker buildx version

      # Building the `test` target configures CMake, generates the Flex lexer
      # and Bison parser, compiles the compiler, and runs CTest. A failing
      # build or test fails the workflow.
      - name: Build image and run test suite
        run: docker build --target test -t myl:test .

      - name: End-to-end smoke test
        run: docker run --rm myl:test bash tests/smoke.sh

      - name: Re-run CTest (image default command)
        run: docker run --rm myl:test
